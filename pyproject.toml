[project]
name = "imagegen-svc"
version = "0.1.0"
description = "生成式出图 worker：atmosphere-visual / realism-pass（扩散模型），外部模型 API / GPU 推理伸缩轴（V1.4 物理拆分）"
requires-python = ">=3.12"
dependencies = [
  "ishome-contracts",
  "temporalio>=1.8",
  "pydantic>=2.9",
  # 私有对象存储：母版从桶里取（几何唯一源），风格图写回同一前缀。图不进编排 payload——
  # 那是拿 Temporal 当文件传输通道用。
  "oss2>=2.18",
  # 写实化那条路（realism-pass）：控制稿由 render3d 的 line.png 反色得来、保真度尺子做 Sobel+NMS——
  # 两件都是像素级运算，靠 PNG 头读尺寸那套不够用。只在 realism / fidelity_metric 两个模块里用。
  "numpy>=2.0",
  "pillow>=10.0",
]

[project.scripts]
imagegen-worker = "imagegen_worker.worker:main"
imagegen = "imagegen_worker.cli:main"

[tool.uv.sources]
ishome-contracts = { git = "ssh://git@github.com/tommax-bai/ishome-contracts.git", tag = "v0.2.0", subdirectory = "gen/python" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/imagegen_worker"]

[dependency-groups]
dev = [
  "ruff>=0.8",
  "mypy>=1.13",
  "import-linter>=2.1",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
]

# ---------------------------------------------------------------------------
# ruff（lint + format）——口径同 ishome-aipipe 根配置
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

# ---------------------------------------------------------------------------
# mypy（strict）
# ---------------------------------------------------------------------------
[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests"]

# oss2 不带 py.typed（阿里云 OSS SDK）；定向忽略，勿扩大范围
[[tool.mypy.overrides]]
module = ["oss2", "oss2.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

# ---------------------------------------------------------------------------
# import-linter：模块依赖方向契约（违规挂质量门）。
# 规则来源：《开发规范与代码分层》§1.3；禁 utils/common/helpers 目录。
# ---------------------------------------------------------------------------
[tool.importlinter]
root_packages = ["imagegen_worker"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "worker|cli → activities → atmosphere|realism → fidelity_metric_v3 → style_prompt|fidelity_metric → models 单向"
type = "layers"
# 两个入口同层且互不可见（"|" = independent siblings）：`worker` 是 Temporal 入口，
# `cli` 是本地出一张图的工具。风格图（atmosphere）与写实化（realism）是两条互不可见的
# 纯库路；保真度尺子（fidelity_metric）与提示词（style_prompt）同层互不可见。
# 尺子 v3（fidelity_metric_v3）借 v2 的函数与常量，所以在 v2 上一层、v2 看不见它；
# 它看不见 style_prompt 由下面它自己的禁入契约锁。
layers = [
  "worker | cli",
  "activities",
  "atmosphere | realism",
  "fidelity_metric_v3",
  "style_prompt | fidelity_metric",
  "models",
]
containers = ["imagegen_worker"]

[[tool.importlinter.contracts]]
name = "出站边缘 image_gateway 不感知上层：只认逻辑模型名与字节，换模型不动代码"
type = "forbidden"
source_modules = ["imagegen_worker.image_gateway"]
forbidden_modules = [
  "imagegen_worker.models",
  "imagegen_worker.style_prompt",
  "imagegen_worker.atmosphere",
  "imagegen_worker.realism",
  "imagegen_worker.fidelity_metric",
  "imagegen_worker.fidelity_metric_v3",
  "imagegen_worker.activities",
  "imagegen_worker.worker",
  "imagegen_worker.cli",
]

[[tool.importlinter.contracts]]
name = "出站边缘 image_store 不感知上层：收键与字节、回字节——写图的那只手看不见图里画了什么"
type = "forbidden"
source_modules = ["imagegen_worker.image_store"]
forbidden_modules = [
  "imagegen_worker.models",
  "imagegen_worker.style_prompt",
  "imagegen_worker.atmosphere",
  "imagegen_worker.realism",
  "imagegen_worker.fidelity_metric",
  "imagegen_worker.fidelity_metric_v3",
  "imagegen_worker.image_gateway",
  "imagegen_worker.activities",
  "imagegen_worker.worker",
  "imagegen_worker.cli",
  "temporalio",
]

[[tool.importlinter.contracts]]
name = "保真度尺子 fidelity_metric 不感知上层：收两份图字节、回一个分数——它只回答几何锁没锁住"
type = "forbidden"
source_modules = ["imagegen_worker.fidelity_metric"]
forbidden_modules = [
  "imagegen_worker.models",
  "imagegen_worker.style_prompt",
  "imagegen_worker.atmosphere",
  "imagegen_worker.realism",
  "imagegen_worker.image_gateway",
  "imagegen_worker.image_store",
  "imagegen_worker.activities",
  "imagegen_worker.worker",
  "imagegen_worker.cli",
  "temporalio",
]

[[tool.importlinter.contracts]]
name = "保真度尺子 fidelity_metric_v3 不感知上层：只借 v2 的函数与常量，同样只收两份图字节、回分数与位移"
type = "forbidden"
source_modules = ["imagegen_worker.fidelity_metric_v3"]
forbidden_modules = [
  "imagegen_worker.models",
  "imagegen_worker.style_prompt",
  "imagegen_worker.atmosphere",
  "imagegen_worker.realism",
  "imagegen_worker.image_gateway",
  "imagegen_worker.image_store",
  "imagegen_worker.activities",
  "imagegen_worker.worker",
  "imagegen_worker.cli",
  "temporalio",
]
